# Continuous integration: manifest validation, lint, a compendium pack build and the unit tests.
#
# Runs on every push and pull request. This is separate from the release workflow
# (main.yml), which only fires when a GitHub release is published.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# These checks only read the repository, so the token is limited to that.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Fail fast if the manifest isn't valid JSON or names a script, stylesheet or pack that
      # doesn't exist — Foundry parses it at load and there is no build step to catch either.
      - name: Validate Manifest
        run: npm run validate:json

      - name: Lint
        run: npm run lint

      # The release workflow builds the compendium packs from src/packs/; building them here catches a broken YAML
      # file before a release does.
      - name: Build Compendium Packs
        run: npm run build:packs

      # The unit tests run the module's rules in plain Node against stand-ins for Foundry. The end-to-end tests
      # need a real Foundry install, so they are run locally (npm run test:e2e) rather than here.
      - name: Unit Tests
        run: npm test
